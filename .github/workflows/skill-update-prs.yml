name: Skill update PR automation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      resume_closed:
        description: Resume after the latest managed PR was closed without merge
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: skill-update-pr-automation-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.SKILLS_AUTO_UPDATE == 'true')
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      resume-closed: ${{ steps.gate.outputs.resume-closed }}
      candidate-status: ${{ steps.candidate-report.outputs.candidate-status }}
      failure-state: ${{ steps.candidate-report.outputs.failure-state }}
      summary-only: ${{ steps.candidate-report.outputs.summary-only }}
      artifact-kind: ${{ steps.artifact.outputs.artifact-kind }}
      candidate-sha: ${{ steps.artifact.outputs.candidate-sha }}
      origin-run-id: ${{ steps.artifact.outputs.origin-run-id }}
      origin-run-attempt: ${{ steps.artifact.outputs.origin-run-attempt }}
    env:
      CANDIDATE_DIR: ${{ runner.temp }}/skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_REPORT_FILE: ${{ runner.temp }}/skill-update-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Checkout default branch history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Validate trigger and inputs
        id: gate
        env:
          SKILLS_AUTO_UPDATE: ${{ vars.SKILLS_AUTO_UPDATE }}
          AUTOMATION_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: node repo-tools/skill-update-automation/workflow/gate.ts >> "$GITHUB_OUTPUT"
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Resolve default branch identity
        id: default-branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'ref=refs/heads/%s\n' "$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Create candidate artifact
        id: candidate
        if: steps.gate.outputs.should-run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_CLOSED: ${{ steps.gate.outputs.resume-closed }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH_SHA: ${{ steps.default-branch.outputs.sha }}
          DEFAULT_BRANCH_REF: ${{ steps.default-branch.outputs.ref }}
        run: |
          set -euo pipefail
          resume=()
          if [ "$RESUME_CLOSED" = "true" ]; then
            resume+=(--resume-closed)
          fi
          node repo-tools/entrypoint.mjs skills:automation:candidate \
            --output "$CANDIDATE_DIR" \
            --repository-id "$REPOSITORY_ID" \
            --repository "$REPOSITORY" \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --trigger-sha "$TRIGGER_SHA" \
            --default-branch-sha "$DEFAULT_BRANCH_SHA" \
            --default-branch-ref "$DEFAULT_BRANCH_REF" \
            "${resume[@]}" | tee "$CANDIDATE_REPORT_FILE"
      - name: Read candidate command report
        id: candidate-report
        if: always() && steps.gate.outputs.should-run == 'true'
        run: node repo-tools/skill-update-automation/candidate/report.ts >> "$GITHUB_OUTPUT"
      - name: Summarize read-only detection stop
        if: steps.candidate-report.outputs.summary-only == 'true'
        run: node repo-tools/skill-update-automation/candidate/report.ts --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Read candidate artifact outputs
        id: artifact
        if: steps.candidate.outcome == 'success' && steps.candidate-report.outputs.failure-state == ''
        run: node repo-tools/skill-update-automation/publish/artifact-kind.ts >> "$GITHUB_OUTPUT"
      - name: Upload candidate artifact
        if: >-
          steps.candidate.outcome == 'success' && steps.candidate-report.outputs.failure-state == '' &&
          steps.artifact.outputs.artifact-kind != 'recovery'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact recovery descriptor
        if: >-
          steps.candidate.outcome == 'success' && steps.candidate-report.outputs.failure-state == '' &&
          steps.artifact.outputs.artifact-kind == 'recovery'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact candidate report
        if: always() && steps.gate.outputs.should-run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-update-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup candidate artifact
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node repo-tools/skill-update-automation/workflow/cleanup.ts

  publish-draft:
    needs: detect
    if: needs.detect.outputs.should-run == 'true' && needs.detect.outputs.artifact-kind == 'candidate-update'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate-sha: ${{ steps.publish-draft.outputs.candidate-sha }}
      pr-number: ${{ steps.publish-draft.outputs.pr-number }}
      permission-operation: ${{ steps.publish-draft.outputs.permission-operation }}
      permission-post-state: ${{ steps.publish-draft.outputs.permission-post-state }}
    env:
      PUBLISH_DIR: ${{ runner.temp }}/skill-update-publish-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout automation source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-publish-${{ github.run_id }}-${{ github.run_attempt }}/candidate
      - name: Resolve journal creator numeric ID
        id: journal-creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          creator_id="$(gh api '/users/github-actions%5Bbot%5D' --jq .id)"
          case "$creator_id" in
            ''|*[!0-9]*) echo 'invalid github-actions bot user ID' >&2; exit 1 ;;
          esac
          printf 'id=%s\n' "$creator_id" >> "$GITHUB_OUTPUT"
      - name: Publish managed draft
        id: publish-draft
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_CLOSED: ${{ needs.detect.outputs.resume-closed }}
          ARTIFACT_DIR: ${{ runner.temp }}/skill-update-publish-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          RECEIPT_FILE: ${{ runner.temp }}/skill-update-publish-${{ github.run_id }}-${{ github.run_attempt }}/draft-receipt.json
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATOR_USER_ID: ${{ steps.journal-creator.outputs.id }}
        run: node repo-tools/skill-update-automation/publish/command.ts >> "$GITHUB_OUTPUT"
      - name: Upload exact draft receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-update-draft-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-publish-${{ github.run_id }}-${{ github.run_attempt }}/draft-receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup publish stage
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGE: publish
        run: node repo-tools/skill-update-automation/publish/cleanup.ts

  recover:
    needs: detect
    if: needs.detect.outputs.should-run == 'true' && needs.detect.outputs.artifact-kind == 'recovery'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      recovery-status: ${{ steps.recover.outputs.recovery-status }}
      candidate-sha: ${{ steps.recover.outputs.candidate-sha }}
    env:
      RECOVERY_DIR: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout automation source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Download exact recovery descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}/descriptor
      - name: Download immutable origin candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-candidate-${{ needs.detect.outputs.origin-run-id }}-${{ needs.detect.outputs.origin-run-attempt }}
          path: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}/origin
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.detect.outputs.origin-run-id }}
      - name: Resolve journal creator numeric ID
        id: recovery-journal-creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          creator_id="$(gh api '/users/github-actions%5Bbot%5D' --jq .id)"
          case "$creator_id" in
            ''|*[!0-9]*) echo 'invalid github-actions bot user ID' >&2; exit 1 ;;
          esac
          printf 'id=%s\n' "$creator_id" >> "$GITHUB_OUTPUT"
      - name: Recover exact transitional state
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_ARTIFACT_DIR: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}/descriptor
          ORIGIN_ARTIFACT_DIR: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}/origin
          OUTPUT_ARTIFACT_DIR: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          CREATOR_USER_ID: ${{ steps.recovery-journal-creator.outputs.id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node repo-tools/skill-update-automation/recovery/command.ts >> "$GITHUB_OUTPUT"
      - name: Upload current-run validation artifact
        if: steps.recover.outputs.recovery-status == 'validation-required'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup recovery stage
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGE: recovery
        run: node repo-tools/skill-update-automation/publish/cleanup.ts

  cleanup-merged:
    needs: [detect, publish-draft]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.should-run == 'true' &&
      (needs.detect.outputs.artifact-kind == 'candidate-update' ||
      needs.detect.outputs.artifact-kind == 'existing-head-validation' ||
      needs.detect.outputs.artifact-kind == 'no-op')
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cleanup-status: ${{ steps.cleanup-merged.outputs.cleanup-status }}
      cleanup-failed-refs: ${{ steps.cleanup-merged.outputs.cleanup-failed-refs }}
    steps:
      - name: Checkout automation source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Resolve journal creator numeric ID
        id: cleanup-journal-creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          creator_id="$(gh api '/users/github-actions%5Bbot%5D' --jq .id)"
          case "$creator_id" in
            ''|*[!0-9]*) echo 'invalid github-actions bot user ID' >&2; exit 1 ;;
          esac
          printf 'id=%s\n' "$creator_id" >> "$GITHUB_OUTPUT"
      - name: Cleanup guarded merged branches
        id: cleanup-merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATOR_USER_ID: ${{ steps.cleanup-journal-creator.outputs.id }}
        run: node repo-tools/skill-update-automation/finalize/cleanup-command.ts >> "$GITHUB_OUTPUT"

  validate:
    needs: [detect, publish-draft, recover]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.should-run == 'true' &&
      (needs.detect.outputs.artifact-kind == 'existing-head-validation' || needs.publish-draft.result == 'success' ||
      needs.recover.outputs.recovery-status == 'validation-required')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checkout-outcome: ${{ steps.checkout.outcome }}
      artifact-outcome: ${{ steps.candidate-artifact.outcome }}
      validation-outcome: ${{ steps.validate-candidate.outcome }}
      validation-status: ${{ steps.validate-candidate.outputs.validation-status }}
      failure-kind: ${{ steps.validate-candidate.outputs.failure-kind }}
      command: ${{ steps.validate-candidate.outputs.command }}
      stage: ${{ steps.validate-candidate.outputs.stage }}
    env:
      VALIDATION_DIR: ${{ runner.temp }}/skill-update-validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact candidate SHA
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.recover.outputs.candidate-sha || needs.detect.outputs.candidate-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14"
          activate-environment: true
      - name: Sync Python dependencies (locked)
        run: uv sync --locked
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Download exact candidate artifact
        id: candidate-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-validation-${{ github.run_id }}-${{ github.run_attempt }}/candidate
      - name: Download exact draft receipt
        if: needs.detect.outputs.artifact-kind == 'candidate-update'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-draft-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-validation-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate exact candidate integration
        id: validate-candidate
        continue-on-error: true
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/skill-update-validation-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          RECEIPT_FILE: ${{ runner.temp }}/skill-update-validation-${{ github.run_id }}-${{ github.run_attempt }}/draft-receipt.json
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.recover.outputs.candidate-sha || needs.detect.outputs.candidate-sha }}
        run: |
          node repo-tools/skill-update-automation/publish/validate-command.ts \
            --merge-command "git merge --no-commit --no-ff $TRIGGER_SHA" \
            --check-command "uv run --no-sync task check" \
            --focused-command "node --test repo-tools/skill-update-automation/**/*.test.ts"
      - name: Cleanup validation stage
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGE: validation
        run: node repo-tools/skill-update-automation/publish/cleanup.ts

  publish-finalize:
    needs: [detect, publish-draft, recover, validate, cleanup-merged]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.should-run == 'true' &&
      needs.detect.outputs.candidate-status != '' && needs.detect.outputs.summary-only != 'true' &&
      (needs.detect.outputs.artifact-kind != 'recovery' ||
      needs.recover.outputs.recovery-status == 'validation-required' ||
      needs.recover.outputs.recovery-status == 'ready-recovered')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINALIZE_DIR: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout automation source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Download exact candidate report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download exact candidate artifact
        if: >-
          needs.detect.outputs.failure-state == '' &&
          (needs.detect.outputs.artifact-kind == 'candidate-update' ||
          needs.detect.outputs.artifact-kind == 'existing-head-validation' ||
          needs.recover.outputs.recovery-status == 'validation-required')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/candidate
      - name: Download stable no-op reconciliation artifact
        if: needs.detect.outputs.artifact-kind == 'no-op'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/reconciliation
      - name: Download exact ready recovery descriptor
        if: >-
          needs.detect.outputs.artifact-kind == 'recovery' &&
          needs.recover.outputs.recovery-status == 'ready-recovered'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/reconciliation
      - name: Download exact draft receipt
        if: needs.detect.outputs.artifact-kind == 'candidate-update' && needs.publish-draft.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-update-draft-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Resolve journal creator numeric ID
        id: journal-creator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          creator_id="$(gh api '/users/github-actions%5Bbot%5D' --jq .id)"
          case "$creator_id" in
            ''|*[!0-9]*) echo 'invalid github-actions bot user ID' >&2; exit 1 ;;
          esac
          printf 'id=%s\n' "$creator_id" >> "$GITHUB_OUTPUT"
      - name: Reconcile ready candidate tracking failures
        id: reconcile-ready
        if: >-
          needs.detect.outputs.artifact-kind == 'no-op' ||
          (needs.detect.outputs.artifact-kind == 'recovery' &&
          needs.recover.outputs.recovery-status == 'ready-recovered')
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/reconciliation
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATOR_USER_ID: ${{ steps.journal-creator.outputs.id }}
          CLEANUP_STATUS: ${{ needs.cleanup-merged.outputs.cleanup-status }}
          CLEANUP_OUTCOME: ${{ needs.cleanup-merged.result }}
          CLEANUP_FAILED_REFS: ${{ needs.cleanup-merged.outputs.cleanup-failed-refs }}
        run: node repo-tools/skill-update-automation/finalize/ready-reconciliation-command.ts >> "$GITHUB_OUTPUT"
      - name: Publish detection outcome
        id: publish-detection-outcome
        if: >-
          always() && needs.detect.outputs.artifact-kind != 'recovery' &&
          (needs.detect.outputs.artifact-kind != 'no-op' ||
          steps.reconcile-ready.outputs.ready-reconciliation-status == 'not-applicable')
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REPORT_FILE: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/skill-update-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}.json
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATOR_USER_ID: ${{ steps.journal-creator.outputs.id }}
          PUBLISH_DRAFT_RESULT: ${{ needs.publish-draft.result }}
          PUBLISH_DRAFT_PERMISSION_OPERATION: ${{ needs.publish-draft.outputs.permission-operation }}
          PUBLISH_DRAFT_PERMISSION_POST_STATE: ${{ needs.publish-draft.outputs.permission-post-state }}
          CLEANUP_STATUS: ${{ needs.cleanup-merged.outputs.cleanup-status }}
          CLEANUP_OUTCOME: ${{ needs.cleanup-merged.result }}
          CLEANUP_FAILED_REFS: ${{ needs.cleanup-merged.outputs.cleanup-failed-refs }}
        run: node repo-tools/skill-update-automation/finalize/detection-command.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Publish finalized state
        id: publish-finalize
        if: >-
          needs.detect.outputs.failure-state == '' &&
          needs.detect.outputs.artifact-kind != 'no-op' &&
          (needs.detect.outputs.artifact-kind == 'existing-head-validation' || needs.publish-draft.result == 'success' ||
          needs.recover.outputs.recovery-status == 'validation-required') &&
          needs.validate.result != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          RECEIPT_FILE: ${{ runner.temp }}/skill-update-finalize-${{ github.run_id }}-${{ github.run_attempt }}/draft-receipt.json
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATOR_USER_ID: ${{ steps.journal-creator.outputs.id }}
          VALIDATION_JOB_RESULT: ${{ needs.validate.result }}
          VALIDATION_CHECKOUT_OUTCOME: ${{ needs.validate.outputs.checkout-outcome }}
          VALIDATION_ARTIFACT_OUTCOME: ${{ needs.validate.outputs.artifact-outcome }}
          VALIDATION_STEP_OUTCOME: ${{ needs.validate.outputs.validation-outcome }}
          VALIDATION_STATUS: ${{ needs.validate.outputs.validation-status }}
          VALIDATION_FAILURE_KIND: ${{ needs.validate.outputs.failure-kind }}
          VALIDATION_COMMAND: ${{ needs.validate.outputs.command }}
          VALIDATION_STAGE: ${{ needs.validate.outputs.stage }}
        run: node repo-tools/skill-update-automation/finalize/command.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup finalize stage
        if: always()
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node repo-tools/skill-update-automation/finalize/cleanup.ts
