name: extras-smoke

# extras（research / notebook / experiment）の導入手順が壊れていないことの継続検証線。
# 手動トリガ専用（workflow_dispatch）: push / PR では走らせない。extras の上流
# breakage（mlflow / dvc 等）でコア CI を赤化させないため、コア green とは分離する。
# action はコア CI と同じ SHA でピンする。

on:
  workflow_dispatch:

jobs:
  extras-smoke:
    name: extras-smoke (Node 24 / Python 3.14, all extras + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
          activate-environment: true
      - name: Runtime preflight
        run: node repo-tools/entrypoint.mjs runtime-preflight
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Sync (all extras)
        run: uv sync --all-extras
      - name: import smoke (numpy / pandas / jupytext)
        run: |
          uv run --no-sync python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-sync python -c "import pandas; print('pandas', pandas.__version__)"
          uv run --no-sync python -c "import jupytext; print('jupytext', jupytext.__version__)"
