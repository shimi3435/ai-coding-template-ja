name: extras-smoke

# extras（research / notebook / experiment）の導入手順が壊れていないことの継続検証線。
# 手動トリガ専用（workflow_dispatch）: push / PR では走らせない。extras の上流
# breakage（mlflow / dvc 等）でコア CI を赤化させないため、コア green とは分離する。
# action はコア CI と同じ SHA でピンする。

on:
  workflow_dispatch:

jobs:
  extras-smoke:
    name: extras-smoke (uv sync --all-extras + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (all extras)
        run: uv sync --all-extras
      - name: import smoke (numpy / pandas / jupytext)
        run: |
          uv run --no-sync python -c "
          import numpy, pandas, jupytext
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('jupytext', jupytext.__version__)
          "
