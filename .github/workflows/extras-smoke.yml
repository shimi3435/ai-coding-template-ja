name: extras-smoke

# extras（research / notebook / experiment）の導入手順が壊れていないことの継続検証線。
# 手動トリガ専用（workflow_dispatch）: push / PR では走らせない。extras の上流
# breakage（mlflow / dvc 等）でコア CI を赤化させないため、コア green とは分離する。
# action はコア CI と同じ SHA でピンする。

on:
  workflow_dispatch:

jobs:
  extras-smoke:
    name: extras-smoke (uv sync --all-extras + import) (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # 片方の version の失敗でもう片方の結果が見えなくなるのを防ぐ。
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync (all extras)
        run: uv sync --all-extras
      - name: import smoke (numpy / pandas / jupytext)
        run: |
          uv run --no-sync python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-sync python -c "import pandas; print('pandas', pandas.__version__)"
          uv run --no-sync python -c "import jupytext; print('jupytext', jupytext.__version__)"
