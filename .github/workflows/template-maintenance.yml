name: Template maintenance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  maintenance:
    name: check (Node 24 / Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
          activate-environment: true
      - name: Runtime preflight
        run: node repo-tools/entrypoint.mjs runtime-preflight
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.51.1"
      - name: Sync (locked)
        run: uv sync --locked
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Prepare pinned shell parser
        run: uv run --no-sync python scripts/setup-shell-parser.py
      - name: Template maintenance gate
        run: task check:template
