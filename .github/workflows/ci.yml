name: CI

on:
  push:
    branches: [main]
  pull_request:

# コア CI（check / rename-smoke。Node 24 / Python 3.14 baseline）
# ＋ secret スキャン（security・PR2 で追加）
# ＋ 依存監査 / SAST（audit・PR3b で追加）＋ OpenSpec change ゲート
# （openspec-validate）。security（gitleaks = secret）と
# audit（pip-audit = 依存 CVE / bandit = SAST）は役割が別なのでジョブを分離する。
# action は供給網安全のため SHA でピンする（コメントにタグを併記）。

jobs:
  check:
    name: check (Node 24 / Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.14"
          activate-environment: true
      - name: Runtime preflight
        run: node repo-tools/entrypoint.mjs runtime-preflight
      - name: Sync (locked)
        run: uv sync --locked
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Repository contracts
        run: node repo-tools/entrypoint.mjs check-contracts
      - name: TypeScript typecheck
        run: node_modules/.bin/tsc --noEmit
      - name: Node tests
        run: node --test repo-tools/*.test.ts
      - name: ruff format --check
        run: uv run --no-sync ruff format --check .
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: basedpyright
        run: uv run --no-sync basedpyright
      - name: pytest
        run: uv run --no-sync pytest

  rename-smoke:
    name: rename-smoke (改名後にフル check 相当)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.14"
          activate-environment: true
      - name: Runtime preflight
        run: node repo-tools/entrypoint.mjs runtime-preflight
      - name: Sync (locked)
        run: uv sync --locked
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: rename (apply・使い捨て名)
        run: uv run python scripts/rename-package.py ci_rename_smoke --apply
      - name: Repository contracts
        run: node repo-tools/entrypoint.mjs check-contracts
      - name: TypeScript typecheck
        run: node_modules/.bin/tsc --noEmit
      - name: Node tests
        run: node --test repo-tools/*.test.ts
      - name: ruff format --check
        run: uv run --no-sync ruff format --check .
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: basedpyright
        run: uv run --no-sync basedpyright
      - name: pytest
        run: uv run --no-sync pytest

  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action は PR イベントで PR の commit 一覧を GitHub API から取得するため
    # pull-requests: read が要る（既定トークンには無く 403 になる）。
    permissions:
      contents: read
      pull-requests: read
    steps:
      # gitleaks は全履歴を走査するため fetch-depth: 0（浅い clone だと検出漏れ）。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 個人の public repo は無料（GITLEAKS_LICENSE 不要で green）。
          # 組織（org）所有 repo は GITLEAKS_LICENSE が必須（未設定だと失敗する）。
          # その場合は repo secrets に GITLEAKS_LICENSE を設定すること。
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: audit (npm / pip-audit / bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (locked)
        run: uv sync --locked
      - name: Install Node dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      # 監査対象は uv export の既定セット（default groups = dev ＋ 推移依存）に固定。
      # extras（mlflow / dvc 等）は export 既定で除外＝コアゲート対象外
      # （extras 込みの任意監査は docs/optional/extras-audit.md）。
      # task security と同一コマンド（監査範囲を一致させる）。
      - name: pip-audit (コア依存セット)
        run: |
          req="$(mktemp)"
          uv export --locked --format requirements-txt --no-emit-project -o "$req"
          uv run --locked --group security pip-audit -r "$req"
          rm -f "$req"
      # ハードゲートは src のみ・severity medium+（-ll）。tests / scripts の除外理由は
      # pyproject [tool.bandit] に記載（scripts は task security が助言実行で可視化）。
      - name: bandit (src・medium+)
        run: uv run --locked --group security bandit -c pyproject.toml -r src -ll

  # task openspec:validate と同じ gate を CI で回す（PR 途中のコミットは pre-merge
  # close 前の change ディレクトリを運ぶため、malformed / invalid をレビュー中に検出
  # できる）。空の openspec/changes/（.gitkeep のみ = main への push・close 済み PR）
  # では CLI が「No items found to validate.」exit 0 を返し trivially green。
  # OpenSpec 自体を撤去した下流はこのジョブも撤去する（他ジョブから独立）。
  openspec-validate:
    name: openspec-validate (change ゲート)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Sync (locked)
        run: uv sync --locked
      # openspec CLI は baseline の Node 24 へ導入する。
      # exact pin でゲート挙動を固定する（bump は人起点・実機検証済み版に揃える）。
      - name: Install openspec CLI (exact pin)
        run: npm install -g @fission-ai/openspec@1.3.1
      - name: openspec validate gate
        run: uv run --no-sync python scripts/openspec-validate-gate.py
