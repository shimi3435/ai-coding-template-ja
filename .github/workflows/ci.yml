name: CI

on:
  push:
    branches: [main]
  pull_request:

# コア CI（check / rename-smoke）＋ secret スキャン（security・PR2 で追加）
# ＋ 依存監査 / SAST（audit・PR3b で追加）＋ OpenSpec change ゲート
# （openspec-validate）。security（gitleaks = secret）と
# audit（pip-audit = 依存 CVE / bandit = SAST）は役割が別なのでジョブを分離する。
# action は供給網安全のため SHA でピンする（コメントにタグを併記）。

jobs:
  check:
    name: check (ruff / basedpyright / pytest) (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # 片方の version の失敗でもう片方の結果が見えなくなるのを防ぐ。
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # matrix は「その版を .python-version に pin した下流」を再現する。pin を
      # 揃えないと doctor の pin / 実行系整合チェック（と対応する smoke テスト）が
      # 意図どおり FAIL する。
      - name: Align .python-version to matrix
        run: echo "${{ matrix.python-version }}" > .python-version
      - name: Sync (locked)
        run: uv sync --locked
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  rename-smoke:
    name: rename-smoke (改名後にフル check 相当)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked
      - name: rename (apply・使い捨て名)
        run: uv run python scripts/rename-package.py ci_rename_smoke --apply
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action は PR イベントで PR の commit 一覧を GitHub API から取得するため
    # pull-requests: read が要る（既定トークンには無く 403 になる）。
    permissions:
      contents: read
      pull-requests: read
    steps:
      # gitleaks は全履歴を走査するため fetch-depth: 0（浅い clone だと検出漏れ）。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 個人の public repo は無料（GITLEAKS_LICENSE 不要で green）。
          # 組織（org）所有 repo は GITLEAKS_LICENSE が必須（未設定だと失敗する）。
          # その場合は repo secrets に GITLEAKS_LICENSE を設定すること。
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: audit (pip-audit / bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked
      # 監査対象は uv export の既定セット（default groups = dev ＋ 推移依存）に固定。
      # extras（mlflow / dvc 等）は export 既定で除外＝コアゲート対象外
      # （extras 込みの任意監査は docs/optional/extras-audit.md）。
      # task security と同一コマンド（監査範囲を一致させる）。
      - name: pip-audit (コア依存セット)
        run: |
          req="$(mktemp)"
          uv export --locked --format requirements-txt --no-emit-project -o "$req"
          uv run --locked --group security pip-audit -r "$req"
          rm -f "$req"
      # ハードゲートは src のみ・severity medium+（-ll）。tests / scripts の除外理由は
      # pyproject [tool.bandit] に記載（scripts は task security が助言実行で可視化）。
      - name: bandit (src・medium+)
        run: uv run --locked --group security bandit -c pyproject.toml -r src -ll

  # task openspec:validate と同じ gate を CI で回す（PR 途中のコミットは pre-merge
  # close 前の change ディレクトリを運ぶため、malformed / invalid をレビュー中に検出
  # できる）。空の openspec/changes/（.gitkeep のみ = main への push・close 済み PR）
  # では CLI が「No items found to validate.」exit 0 を返し trivially green。
  # OpenSpec 自体を撤去した下流はこのジョブも撤去する（他ジョブから独立）。
  openspec-validate:
    name: openspec-validate (change ゲート)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked
      # openspec CLI は runner 同梱の Node で導入する（新規 action を増やさない）。
      # exact pin でゲート挙動を固定する（bump は人起点・実機検証済み版に揃える）。
      # コアの Node 非依存（ADR-0002）は bootstrap / 下流ローカルの話で、CI runner
      # 内の導入はこれに反しない。
      - name: Install openspec CLI (exact pin)
        run: npm install -g @fission-ai/openspec@1.3.1
      - name: openspec validate gate
        run: uv run --no-sync python scripts/openspec-validate-gate.py
