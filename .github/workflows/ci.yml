name: CI

on:
  push:
    branches: [main]
  pull_request:

# コア CI（check / rename-smoke）＋ secret スキャン（security・PR2 で追加）。
# action は供給網安全のため SHA でピンする（コメントにタグを併記）。

jobs:
  check:
    name: check (ruff / basedpyright / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  rename-smoke:
    name: rename-smoke (改名後にフル check 相当)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked
      - name: rename (apply・使い捨て名)
        run: uv run python scripts/rename-package.py ci_rename_smoke --apply
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action は PR イベントで PR の commit 一覧を GitHub API から取得するため
    # pull-requests: read が要る（既定トークンには無く 403 になる）。
    permissions:
      contents: read
      pull-requests: read
    steps:
      # gitleaks は全履歴を走査するため fetch-depth: 0（浅い clone だと検出漏れ）。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 個人の public repo は無料（GITLEAKS_LICENSE 不要で green）。
          # 組織（org）所有 repo は GITLEAKS_LICENSE が必須（未設定だと失敗する）。
          # その場合は repo secrets に GITLEAKS_LICENSE を設定すること。
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
