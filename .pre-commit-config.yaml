# 機械コア（PR1）の軽量フックのみ（§12）。
# basedpyright / pytest は入れない（探索的 WIP コミットを軽く保つ）。
# 型・test は `task check` と CI が担う。
#
# ruff は repo: local + `uv run --no-sync ruff` で実行し、version 源を uv.lock に
# 単一化する（pre-commit が別途 ruff を pin して lock とズレるのを避ける）。

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

  # tag pin（SHA pin でなく v5.0.0・dependabot 監視外）は意図的（CI action の SHA pin
  # 方針との非対称）: pre-commit hooks は CI で実行されず（CI は ruff 等を直接実行）
  # secrets への曝露面が無い。dependabot に pre-commit ecosystem サポートが無く、
  # SHA pin にすると更新追跡手段を失う。tag pin は pre-commit の慣行で
  # `pre-commit autoupdate` が機能する。
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # vendored skill（.agents/skills/）は第三者の原本。整形フックで書き換えると
      # skills.lock.json の sha256 と乖離するため除外する（上流バイト一致を保つ）。
      - id: end-of-file-fixer
        exclude: '^\.agents/skills/'
      - id: trailing-whitespace
        exclude: '^\.agents/skills/'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
