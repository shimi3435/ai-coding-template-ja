[project]
name = "ai-coding-template-ja"
version = "0.1.0"
description = "日本語で AI コーディングエージェントを使う研究用 Python プロジェクトのテンプレート"
readme = "README.md"
# CI で検証しているのは 3.12 / 3.13 / 3.14（ci.yml の matrix）。3.15+ は範囲上は
# 許容するが未検証（リリース後にローカル実測 → matrix 追加を判断する）。
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# オプション層（§5.2/§11.4）。既定では入れない（無印 uv sync は dev group のみ）。
# 導入: task setup:research / setup:notebook / setup:experiment / setup:all
# version は無印にして uv.lock に固定を委ねる（dev group と同方針）。
research = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
]
notebook = [
    "jupyter",
    "jupytext",
    "nbstripout",
    "nbqa",
]
experiment = [
    "hydra-core",
    "mlflow",
    "dvc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# rename 対象（module 形）: src/<module>
packages = ["src/ai_coding_template_ja"]

[dependency-groups]
# コア dev ツール。無印 `uv sync` が既定で入れる（extra ではない・Q23）。
# version は無印にして uv.lock に固定を委ねる。
dev = [
    "ruff",
    "basedpyright",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "hypothesis",
]
# セキュリティ監査ツール（§5.2・PR3b）。非デフォルト group のため無印 `uv sync` では
# 入らない（コア setup は lean 維持）。CI audit ジョブと task security が
# `uv run --group security` で実行する（監査範囲・コマンドを一致させる）。
security = [
    "pip-audit",
    "bandit",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
# 研究コード/numpy/notebook で strict は警告過多になるため basic を既定。
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src", "tests", "scripts"]

[tool.bandit]
# ハードゲート対象は src のみ（CI audit ジョブ / task security が `-r src -ll` で実行）。
# tests はゲート除外（assert・一時パス等の誤検知が多くテスト表現力を優先）。
# scripts もゲート除外だが task security が助言（非ゲート）で走らせて可視化する
# （doctor.py / rename-package.py の subprocess 起動が B603/B607 に当たるため）。
# 個別の抑制は理由コメント付き `# nosec BXXX` を使う。
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rename 対象（module 形）: --cov=<module>
addopts = "--cov=ai_coding_template_ja --cov-report=term-missing"

# fail-under 閾値は意図的に置かない: 研究テンプレでは閾値ゲートが探索的コードの
# コミットを阻害するため、coverage は term-missing による可視化（情報提供）に徹する。
# 閾値が要る下流は [tool.coverage.report] の fail_under を自分で足す。
[tool.coverage.run]
# rename 対象（module 形）
source = ["ai_coding_template_ja"]
