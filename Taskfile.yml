version: "3"

# 人間にも AI にも同じコマンドを使わせる（§13）。
# 機械コア（PR1）＋エージェント統合（PR2）＋オプション層（PR3a: extras / notebook・
# PR3b: security ゲート = pip-audit / bandit）。

tasks:
  setup:
    desc: 初期・再セットアップ（導入済み extras を保持する inexact sync ＋ pre-commit hooks）
    cmds:
      - uv sync --inexact
      - uv run pre-commit install

  setup:research:
    desc: research extra（numpy / scipy / matplotlib / pandas）を加算導入
    cmds:
      - uv sync --inexact --extra research

  setup:notebook:
    desc: notebook extra（jupyter / jupytext / nbstripout / nbqa）を加算導入
    cmds:
      - uv sync --inexact --extra notebook

  setup:experiment:
    desc: experiment extra（hydra-core / mlflow / dvc）を加算導入
    cmds:
      - uv sync --inexact --extra experiment

  setup:all:
    desc: 全 extras（research / notebook / experiment）を一括導入
    cmds:
      - uv sync --all-extras

  check:
    desc: 品質チェック一式（ruff format --check / ruff check / basedpyright / pytest）
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run basedpyright
      - uv run pytest

  check:without-gsd:
    desc: 通常 check が Node / OpenSpec / GSD とネットワークに依存しないことを隔離環境で検証
    cmds:
      - |
        set -eu
        isolation_root="$(mktemp -d)"
        trap 'rm -rf "$isolation_root"' EXIT
        bin="$isolation_root/bin"
        home="$isolation_root/home"
        codex_home="$isolation_root/codex-home"
        gsd_home="$isolation_root/gsd-home"
        xdg_cache="$isolation_root/xdg-cache"
        xdg_config="$isolation_root/xdg-config"
        xdg_data="$isolation_root/xdg-data"
        uv_cache="$isolation_root/uv-cache"
        mkdir -p "$bin" "$home" "$codex_home" "$gsd_home" \
          "$xdg_cache" "$xdg_config" "$xdg_data" "$uv_cache"

        link_tool() {
          tool="$1"
          target="$(command -v "$tool" 2>/dev/null || true)"
          if [ -n "$target" ]; then
            ln -s "$(readlink -f "$target")" "$bin/$tool"
          fi
        }
        for tool in task uv bash sh git env find ln readlink dirname rm mkdir mktemp \
          uname sed grep sort head tail xargs realpath chmod cp mv tr cut awk basename \
          cat touch; do
          link_tool "$tool"
        done
        ln -s "$(readlink -f .venv/bin/python)" "$bin/python"
        ln -s "$(readlink -f .venv/bin/python)" "$bin/python3"

        env -i \
          HOME="$home" \
          CODEX_HOME="$codex_home" \
          GSD_HOME="$gsd_home" \
          XDG_CACHE_HOME="$xdg_cache" \
          XDG_CONFIG_HOME="$xdg_config" \
          XDG_DATA_HOME="$xdg_data" \
          UV_CACHE_DIR="$uv_cache" \
          UV_OFFLINE=1 \
          PATH="$bin" \
          REPOSITORY="$PWD" \
          sh -eu -c '
            ! command -v node >/dev/null 2>&1
            ! command -v openspec >/dev/null 2>&1
            ! command -v npm >/dev/null 2>&1
            ! command -v npx >/dev/null 2>&1
            ! command -v gsd >/dev/null 2>&1
            ! command -v gsd-phase >/dev/null 2>&1
            ! command -v gsd-new-project >/dev/null 2>&1
            if [ -n "$(find "$HOME" "$CODEX_HOME" "$GSD_HOME" -mindepth 1 -print -quit)" ]; then
              echo "[FAIL] isolated HOME/CODEX_HOME/GSD_HOME is not empty" >&2
              exit 1
            fi
            cd "$REPOSITORY"
            exec task check
          '

  fix:
    desc: 自動修正（ruff format ＋ ruff check --fix）
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix

  test:
    desc: pytest を実行
    cmds:
      - uv run pytest

  lint:
    desc: ruff lint
    cmds:
      - uv run ruff check .

  typecheck:
    desc: basedpyright 型チェック
    cmds:
      - uv run basedpyright

  hooks:
    desc: pre-commit hooks を git に登録
    cmds:
      - uv run pre-commit install

  doctor:
    desc: |
      環境診断（read-only・sync しない）。既定は green を保つ助言診断。
        task doctor                 # 既定（到達性なし・gh は WARN）
        task doctor -- --online     # Context7 到達性も確認
        task doctor -- --github     # gh 不在を FAIL 扱い（GitHub 文脈 opt-in）
    cmds:
      - uv run --no-sync python scripts/doctor.py {{.CLI_ARGS}}

  openspec:validate:
    desc: |
      OpenSpec change の validate ゲート（invalid で FAIL・非ゼロ終了）。opt-in であり
      CI / task check / pre-commit には組み込まない（ADR-0002: Node 非コア依存）。
      engine 必須（不在は導入案内＋非ゼロ終了）。changes 空は対象ゼロで exit 0。
      preflight: proposal.md / tasks.md を欠く change は CLI の validate 対象から
      漏れる（fail-open）ため、CLI 実行前に検査して FAIL にする。
    cmds:
      - uv run --no-sync python scripts/openspec-validate-gate.py

  openspec:gsd-handoff:smoke:
    desc: 実 OpenSpec 1.3.1 / GSD 1.5.0 の strictly read-only opt-in smoke
    silent: true
    requires:
      vars:
        - CHANGE_ID
        - GSD_HOME
    env:
      HANDOFF_CHANGE_ID: "{{.CHANGE_ID}}"
      HANDOFF_GSD_HOME: "{{.GSD_HOME}}"
    cmds:
      - |
        set -eu
        cache_root="$(mktemp -d)"
        trap 'rm -rf "$cache_root"' EXIT
        mkdir -p "$cache_root/pycache" "$cache_root/uv-cache" "$cache_root/xdg-cache" \
          "$cache_root/xdg-config" "$cache_root/xdg-data"
        : > "$cache_root/uv.toml"
        PYTHONDONTWRITEBYTECODE=1 \
        PYTHONPYCACHEPREFIX="$cache_root/pycache" \
        UV_CACHE_DIR="$cache_root/uv-cache" \
        UV_CONFIG_FILE="$cache_root/uv.toml" \
        XDG_CACHE_HOME="$cache_root/xdg-cache" \
        XDG_CONFIG_HOME="$cache_root/xdg-config" \
          XDG_DATA_HOME="$cache_root/xdg-data" \
          uv run --no-sync python scripts/openspec-gsd-handoff-smoke.py \
            --repository . --change "$HANDOFF_CHANGE_ID" --gsd-home "$HANDOFF_GSD_HOME"

  rename:
    desc: |
      パッケージ改名。既定は --dry-run（差分表示のみ）。適用は --apply を付ける。
        task rename -- <module>            # dry-run
        task rename -- <module> --apply    # 実適用（src 名 + pyproject + uv sync 張り直し）
    cmds:
      - uv run python scripts/rename-package.py {{.CLI_ARGS}}

  mcp:setup:
    desc: MCP 設定（.mcp.json / .codex/config.toml）を template ＋ .env から冪等生成
    cmds:
      - bash scripts/setup-mcp.sh

  skills:update:
    desc: vendored skill の symlink（.claude/skills・.codex/skills）を冪等再生成
    cmds:
      - bash scripts/setup-skills.sh

  skills:doctor:
    desc: skills.lock.json と vendored skill の整合を検証（孤児/sha256/symlink 解決）
    cmds:
      - uv run pytest tests/test_skills_lock.py -q

  skills:upstream:
    desc: |
      vendored skill の上流乖離チェック（opt-in・ネットワーク使用・gh 必須・報告のみ）。
      lock の commit と上流 HEAD を比較し OK/INFO/WARN で報告する（WARN でも exit 0・
      更新は人起点。skill の自動更新や lock の変更はしない）。
    cmds:
      - uv run --no-sync python scripts/skills-upstream-check.py

  security:
    desc: |
      secret / 依存監査 / SAST。gitleaks（在席時・secret 検出で失敗）＋ pip-audit（コア
      依存セット・ゲート）＋ bandit（src ゲート・scripts は助言）。pip-audit / bandit は
      security group（uv run --group security）で実行し CI audit ジョブと範囲・コマンド一致。
      pip-audit は advisory DB 照会にネットワークを使う（check / doctor には入れない）。
    cmds:
      - |
        if command -v gitleaks >/dev/null 2>&1; then
          echo "[INFO] gitleaks を実行します"
          gitleaks detect --no-banner --redact
        else
          echo "[WARN] gitleaks 未導入のためスキップ（CI の security ジョブで実行されます）"
          echo "       導入: https://github.com/gitleaks/gitleaks"
        fi
      # pip-audit（ゲート）: 監査対象は uv export の既定セット（default groups = dev ＋
      # 推移依存）。extras（mlflow / dvc 等）は export 既定で除外＝コアゲート対象外
      # （extras 込みの任意監査は docs/optional/extras-audit.md）。
      # 不可避 advisory は理由コメント付き --ignore-vuln <ID>（同 docs 参照）。
      - |
        echo "[INFO] pip-audit を実行します（コア依存セット・ゲート）"
        req="$(mktemp)"
        uv export --locked --format requirements-txt --no-emit-project -o "$req"
        uv run --locked --group security pip-audit -r "$req"
        rm -f "$req"
      # bandit（ゲート）: 対象は src のみ・severity medium+（-ll）。設定は pyproject
      # [tool.bandit]（tests / scripts はゲート除外・除外理由もそちらに記載）。
      - |
        echo "[INFO] bandit を実行します（src・ゲート）"
        uv run --locked --group security bandit -c pyproject.toml -r src -ll
      # bandit（助言・非ゲート）: scripts の指摘（doctor.py / rename-package.py の
      # subprocess = B603/B607 等）を CI 赤にせず可視化する。
      - |
        echo "[INFO] bandit を実行します（scripts・助言・失敗しても継続）"
        uv run --locked --group security bandit -c pyproject.toml -r scripts -ll || true

  nb:strip:
    desc: |
      notebook の出力セルを除去（nbstripout・出力への secret / データ混入防止）。
      notebook extra 未導入時はスキップ・案内のみ（exit 0）。
    cmds:
      - |
        if [ ! -x .venv/bin/nbstripout ]; then
          echo "[INFO] nbstripout 未導入のためスキップ（notebook extra）"
          echo "       導入: task setup:notebook"
          exit 0
        fi
        if [ -z "$(git ls-files -co --exclude-standard -- '*.ipynb')" ]; then
          echo "[INFO] 対象の .ipynb がありません"
          exit 0
        fi
        git ls-files -coz --exclude-standard -- '*.ipynb' \
          | xargs -0 uv run --no-sync nbstripout
        echo "[INFO] nbstripout 完了"

  nb:sync:
    desc: |
      ペア済み notebook と対テキスト（py:percent 等）を同期（jupytext --sync）。
      ペア設定は docs/optional/notebook.md 参照。extra 未導入時はスキップ（exit 0）。
    cmds:
      - |
        if [ ! -x .venv/bin/jupytext ]; then
          echo "[INFO] jupytext 未導入のためスキップ（notebook extra）"
          echo "       導入: task setup:notebook"
          exit 0
        fi
        if [ -z "$(git ls-files -co --exclude-standard -- '*.ipynb')" ]; then
          echo "[INFO] 対象の .ipynb がありません"
          exit 0
        fi
        git ls-files -coz --exclude-standard -- '*.ipynb' \
          | xargs -0 uv run --no-sync jupytext --sync
        echo "[INFO] jupytext --sync 完了"

  nb:check:
    desc: |
      notebook を ruff で lint（nbqa ruff）。notebook extra 未導入時はスキップ（exit 0）。
    cmds:
      - |
        if [ ! -x .venv/bin/nbqa ]; then
          echo "[INFO] nbqa 未導入のためスキップ（notebook extra）"
          echo "       導入: task setup:notebook"
          exit 0
        fi
        if [ -z "$(git ls-files -co --exclude-standard -- '*.ipynb')" ]; then
          echo "[INFO] 対象の .ipynb がありません"
          exit 0
        fi
        git ls-files -coz --exclude-standard -- '*.ipynb' \
          | xargs -0 uv run --no-sync nbqa ruff

  prune-template-docs:
    desc: |
      テンプレ自身のメタ文書 docs/template/（ADR 0001-0006・grill）を削除。
      既定は dry-run。実削除は --apply（docs/adr と TEMPLATE_VERSION は不可侵）。
        task prune-template-docs              # dry-run
        task prune-template-docs -- --apply   # 実削除
    cmds:
      - uv run --no-sync python scripts/prune-template-docs.py {{.CLI_ARGS}}

  clean:
    desc: キャッシュ・カバレッジ生成物を削除
    cmds:
      - rm -rf .ruff_cache .pytest_cache .coverage coverage.xml htmlcov
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
