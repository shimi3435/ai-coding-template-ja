version: "3"

# 人間にも AI にも同じコマンドを使わせる（§13）。
# 機械コア（PR1）＋エージェント統合（PR2）＋オプション層（PR3a: extras / notebook）。

tasks:
  setup:
    desc: 初期セットアップ（uv sync = dev group のみ・extra なし ＋ pre-commit hooks）
    cmds:
      - uv sync
      - uv run pre-commit install

  setup:research:
    desc: research extra（numpy / scipy / matplotlib / pandas）を導入
    cmds:
      - uv sync --extra research

  setup:notebook:
    desc: notebook extra（jupyter / jupytext / nbstripout / nbqa）を導入
    cmds:
      - uv sync --extra notebook

  setup:experiment:
    desc: experiment extra（hydra-core / mlflow / dvc）を導入
    cmds:
      - uv sync --extra experiment

  setup:all:
    desc: 全 extras（research / notebook / experiment）を一括導入
    cmds:
      - uv sync --all-extras

  check:
    desc: 品質チェック一式（ruff format --check / ruff check / basedpyright / pytest）
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run basedpyright
      - uv run pytest

  fix:
    desc: 自動修正（ruff format ＋ ruff check --fix）
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix

  test:
    desc: pytest を実行
    cmds:
      - uv run pytest

  lint:
    desc: ruff lint
    cmds:
      - uv run ruff check .

  typecheck:
    desc: basedpyright 型チェック
    cmds:
      - uv run basedpyright

  hooks:
    desc: pre-commit hooks を git に登録
    cmds:
      - uv run pre-commit install

  doctor:
    desc: |
      環境診断（read-only・sync しない）。既定は green を保つ助言診断。
        task doctor                 # 既定（到達性なし・gh は WARN）
        task doctor -- --online     # Context7 到達性も確認
        task doctor -- --github     # gh 不在を FAIL 扱い（GitHub 文脈 opt-in）
    cmds:
      - uv run --no-sync python scripts/doctor.py {{.CLI_ARGS}}

  rename:
    desc: |
      パッケージ改名。既定は --dry-run（差分表示のみ）。適用は --apply を付ける。
        task rename -- <module>            # dry-run
        task rename -- <module> --apply    # 実適用（src 名 + pyproject + uv sync 張り直し）
    cmds:
      - uv run python scripts/rename-package.py {{.CLI_ARGS}}

  mcp:setup:
    desc: MCP 設定（.mcp.json / .codex/config.toml）を template ＋ .env から冪等生成
    cmds:
      - bash scripts/setup-mcp.sh

  skills:update:
    desc: vendored skill の symlink（.claude/skills・.codex/skills）を冪等再生成
    cmds:
      - bash scripts/setup-skills.sh

  skills:doctor:
    desc: skills.lock.json と vendored skill の整合を検証（孤児/sha256/symlink 解決）
    cmds:
      - uv run pytest tests/test_skills_lock.py -q

  security:
    desc: |
      secret / 依存スキャン。gitleaks（在席時・secret 検出で失敗）＋ pip-audit / bandit
      は在席時のみ助言実行（未導入はスキップ・案内。正式追加は PR3）。
    cmds:
      - |
        if command -v gitleaks >/dev/null 2>&1; then
          echo "[INFO] gitleaks を実行します"
          gitleaks detect --no-banner --redact
        else
          echo "[WARN] gitleaks 未導入のためスキップ（CI の security ジョブで実行されます）"
          echo "       導入: https://github.com/gitleaks/gitleaks"
        fi
        if command -v pip-audit >/dev/null 2>&1; then
          echo "[INFO] pip-audit を実行します（助言）"; pip-audit || true
        else
          echo "[INFO] pip-audit 未導入（PR3 で正式追加）"
        fi
        if command -v bandit >/dev/null 2>&1; then
          echo "[INFO] bandit を実行します（助言）"; bandit -q -r src || true
        else
          echo "[INFO] bandit 未導入（PR3 で正式追加）"
        fi

  nb:strip:
    desc: |
      notebook の出力セルを除去（nbstripout・出力への secret / データ混入防止）。
      notebook extra 未導入時はスキップ・案内のみ（exit 0）。
    cmds:
      - |
        if [ ! -x .venv/bin/nbstripout ]; then
          echo "[INFO] nbstripout 未導入のためスキップ（notebook extra）"
          echo "       導入: task setup:notebook"
          exit 0
        fi
        if [ -z "$(git ls-files -co --exclude-standard -- '*.ipynb')" ]; then
          echo "[INFO] 対象の .ipynb がありません"
          exit 0
        fi
        git ls-files -coz --exclude-standard -- '*.ipynb' \
          | xargs -0 uv run --no-sync nbstripout
        echo "[INFO] nbstripout 完了"

  nb:sync:
    desc: |
      ペア済み notebook と対テキスト（py:percent 等）を同期（jupytext --sync）。
      ペア設定は docs/optional/notebook.md 参照。extra 未導入時はスキップ（exit 0）。
    cmds:
      - |
        if [ ! -x .venv/bin/jupytext ]; then
          echo "[INFO] jupytext 未導入のためスキップ（notebook extra）"
          echo "       導入: task setup:notebook"
          exit 0
        fi
        if [ -z "$(git ls-files -co --exclude-standard -- '*.ipynb')" ]; then
          echo "[INFO] 対象の .ipynb がありません"
          exit 0
        fi
        git ls-files -coz --exclude-standard -- '*.ipynb' \
          | xargs -0 uv run --no-sync jupytext --sync
        echo "[INFO] jupytext --sync 完了"

  nb:check:
    desc: |
      notebook を ruff で lint（nbqa ruff）。notebook extra 未導入時はスキップ（exit 0）。
    cmds:
      - |
        if [ ! -x .venv/bin/nbqa ]; then
          echo "[INFO] nbqa 未導入のためスキップ（notebook extra）"
          echo "       導入: task setup:notebook"
          exit 0
        fi
        if [ -z "$(git ls-files -co --exclude-standard -- '*.ipynb')" ]; then
          echo "[INFO] 対象の .ipynb がありません"
          exit 0
        fi
        git ls-files -coz --exclude-standard -- '*.ipynb' \
          | xargs -0 uv run --no-sync nbqa ruff

  prune-template-docs:
    desc: |
      テンプレ自身のメタ文書 docs/template/（ADR 0001-0006・grill）を削除。
      既定は dry-run。実削除は --apply（docs/adr と TEMPLATE_VERSION は不可侵）。
        task prune-template-docs              # dry-run
        task prune-template-docs -- --apply   # 実削除
    cmds:
      - uv run --no-sync python scripts/prune-template-docs.py {{.CLI_ARGS}}

  clean:
    desc: キャッシュ・カバレッジ生成物を削除
    cmds:
      - rm -rf .ruff_cache .pytest_cache .coverage coverage.xml htmlcov
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
